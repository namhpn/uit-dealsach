services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: dealsach-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    networks:
      - dealsach-network

  nginx:
    image: nginx:alpine
    container_name: dealsach-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - dealsach-network

  db:
    image: mariadb:11
    container_name: dealsach-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - dealsach-db-data:/var/lib/mysql
    networks:
      - dealsach-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: dealsach-pma
    restart: unless-stopped
    ports:
      - "${PMA_PORT}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    depends_on:
      - db
    networks:
      - dealsach-network

networks:
  dealsach-network:
    driver: bridge

volumes:
  dealsach-db-data: